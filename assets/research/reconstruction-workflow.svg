<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">Track and profile reconstruction workflow</title><rect width="760" height="420" fill="white"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" text-anchor="start" fill="#243b35">From tracks to a corrected target profile</text><rect x="30" y="80" width="330" height="80" rx="12" fill="#edf5f1" stroke="#bdd2c8"/><text x="195.0" y="110" font-size="21" text-anchor="middle" fill="#243b35">Track finding &amp; fit</text><text x="195.0" y="136" font-size="17" text-anchor="middle" fill="#243b35">Existing Apollonius / GenFit</text><rect x="400" y="80" width="330" height="80" rx="12" fill="#edf5f1" stroke="#bdd2c8"/><text x="565.0" y="110" font-size="21" text-anchor="middle" fill="#243b35">POCA vertex estimate</text><text x="565.0" y="136" font-size="17" text-anchor="middle" fill="#243b35">POCA-First workflow</text><rect x="400" y="210" width="330" height="80" rx="12" fill="#edf5f1" stroke="#bdd2c8"/><text x="565.0" y="240" font-size="21" text-anchor="middle" fill="#243b35">Back-propagation</text><text x="565.0" y="266" font-size="17" text-anchor="middle" fill="#243b35">Corrections + vertex fitting</text><rect x="30" y="210" width="330" height="80" rx="12" fill="#edf5f1" stroke="#bdd2c8"/><text x="195.0" y="240" font-size="21" text-anchor="middle" fill="#243b35">Profile reconstruction</text><text x="195.0" y="266" font-size="17" text-anchor="middle" fill="#243b35">Efficiency + migration correction</text><line x1="365" y1="120" x2="395" y2="120" stroke="#145b56" stroke-width="2" /><text x="380" y="110" font-size="25" text-anchor="middle" fill="#243b35">→</text><line x1="565" y1="165" x2="565" y2="205" stroke="#145b56" stroke-width="2" /><text x="580" y="192" font-size="25" text-anchor="start" fill="#243b35">↓</text><line x1="365" y1="250" x2="395" y2="250" stroke="#145b56" stroke-width="2" /><text x="380" y="240" font-size="25" text-anchor="middle" fill="#243b35">←</text><path d="M195 295 L195 330 L565 330 L565 295" fill="none" stroke="#145b56" stroke-width="2" stroke-dasharray="6 4"/><text x="380" y="362" font-size="20" text-anchor="middle" fill="#243b35">Iterate the assumed profile and efficiency map</text><text x="380" y="398" font-size="18" text-anchor="middle" fill="#243b35">Then integrate the determined profile into luminosity fitting</text></g></svg>